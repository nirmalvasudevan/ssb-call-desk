<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SSB Call Desk</title>
<meta name="theme-color" content="#13236B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SSB Desk">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600&family=Martel:wght@700;800&display=swap">
<style>
:root{
  --ground:#F3F4F9; --surface:#FFFFFF; --sunk:#EAECF4; --ink:#141B33; --muted:#5A6280; --line:#DDE1EC;
  --navy:#13236B; --navy-ink:#FFFFFF; --link:#1E3AA8; --saffron:#C9660E; --saffron-soft:#FCEBD9;
  --warn:#8A5200; --warn-bg:#FFF4DB; --warn-line:#F0D08A; --hl:#FFE7A8; --ok:#1C6B3A; --ok-bg:#DFF3E6; --icon:#1E3AA8; --saffron-btn:#C25F0C;
  --font-body:"Hind",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-display:"Martel",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0D1120; --surface:#161B2E; --sunk:#1D2339; --ink:#E8EBF5; --muted:#9BA3C0; --line:#2A3152;
    --navy:#22347F; --navy-ink:#FFFFFF; --link:#9DB0FF; --saffron:#F2A055; --saffron-soft:#3A2715;
    --warn:#F5C977; --warn-bg:#2E2512; --warn-line:#5C4A1E; --hl:#5A4A12; --ok:#7FD69F; --ok-bg:#15301F; --icon:#AFC0FF; --saffron-btn:#C8660F;
  }
}
:root[data-theme="dark"]{
  --ground:#0D1120; --surface:#161B2E; --sunk:#1D2339; --ink:#E8EBF5; --muted:#9BA3C0; --line:#2A3152;
  --navy:#22347F; --navy-ink:#FFFFFF; --link:#9DB0FF; --saffron:#F2A055; --saffron-soft:#3A2715;
  --warn:#F5C977; --warn-bg:#2E2512; --warn-line:#5C4A1E; --hl:#5A4A12; --ok:#7FD69F; --ok-bg:#15301F; --icon:#AFC0FF; --saffron-btn:#C8660F;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--ground);margin:0}
body{color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
a{color:var(--link)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--saffron);outline-offset:2px}

.top{background:var(--navy);color:var(--navy-ink);padding:12px 16px 10px}
.top-inner,.wrap{max-width:720px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px}
.bt{flex:1;min-width:0}
.logo{flex:none;width:42px;height:42px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,.85)}
.brand h1{font-family:var(--font-display);font-weight:800;font-size:20px;line-height:1.15;margin:0;letter-spacing:.01em}
.call{flex:none;display:flex;align-items:center;gap:6px;color:var(--navy-ink);font-weight:600;font-size:14px;text-decoration:none;white-space:nowrap;background:rgba(255,255,255,.12);border-radius:999px;padding:7px 12px}
.sub{font-size:13px;opacity:.78;margin:1px 0 0}

.searchbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--navy);padding:2px 16px 12px;box-shadow:0 6px 12px -8px rgba(0,0,0,.35)}
.search{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:12px;padding:0 6px 0 12px;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.search svg{flex:none;color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;font-size:17px;padding:12px 0;outline:none}
.search input::placeholder{color:var(--muted)}
.clear{border:0;background:var(--sunk);border-radius:8px;padding:6px 10px;font-size:14px;cursor:pointer}

.wrap{padding-inline:16px;padding-block:16px 110px;display:flex;flex-direction:column;gap:22px}
.label{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}

.glance{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:2px 14px}
.gr{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.gr:last-child{border-bottom:0}
.gr span{flex:none;color:var(--muted);font-size:14px}
.gr b{font-weight:600;font-size:15px;text-align:right;font-variant-numeric:tabular-nums}
.glance dl{margin:0;display:grid;grid-template-columns:auto 1fr;column-gap:14px}
.glance dt,.glance dd{padding:8px 0;border-bottom:1px solid var(--line);margin:0}
.glance dt{color:var(--muted);font-size:14px;white-space:nowrap}
.glance dd{font-weight:600;font-size:15px;font-variant-numeric:tabular-nums;text-align:right}
.glance dt:nth-last-of-type(1),.glance dd:last-of-type{border-bottom:0}

.cats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.cat{position:relative;display:flex;flex-direction:column;gap:3px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 14px;cursor:pointer;min-height:92px}
.cat:active{background:var(--sunk)}
.cat b{font-size:16px;font-weight:600;line-height:1.25}
.ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--sunk);color:var(--navy);margin-bottom:6px}
.cat.pgm .ic{background:rgba(255,255,255,.14);color:#FFC98F}
.cat.agent .ic{background:rgba(201,102,14,.14);color:var(--saffron)}
.ic{color:var(--icon)}
.cat span{font-size:13px;color:var(--muted);line-height:1.35}
.cat i{font-style:normal;font-size:12px;color:var(--saffron);font-weight:600;margin-top:auto;padding-top:6px}
.cat.agent{background:var(--saffron-soft);border-color:transparent}

.recent{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.head{display:flex;align-items:center;gap:10px}
.back{border:0;background:var(--sunk);border-radius:10px;padding:8px 12px;cursor:pointer;font-weight:600;font-size:15px}
.head h2{font-family:var(--font-display);font-size:20px;margin:0;line-height:1.25;text-wrap:balance}
.meta{font-size:14px;color:var(--muted);margin:-12px 0 0}

.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.item+.item{border-top:1px solid var(--line)}
.q{width:100%;display:flex;gap:10px;align-items:flex-start;text-align:left;border:0;background:transparent;padding:14px;cursor:pointer}
.q .t{flex:1;font-weight:600;font-size:16px;line-height:1.35}
.q .c{display:block;font-weight:500;font-size:12px;color:var(--saffron);letter-spacing:.04em;text-transform:uppercase;margin-bottom:2px}
.q .s{display:block;font-weight:400;font-size:14.5px;color:var(--muted);margin-top:3px}
.q svg{flex:none;margin-top:3px;color:var(--muted);transition:transform .15s}
.item.open .q svg{transform:rotate(180deg)}
.item.open .q .s{display:none}
.item:not(.open) .a{display:none}
.a{padding:0 14px 16px;display:flex;flex-direction:column;gap:12px}
.say{background:var(--sunk);border-radius:10px;padding:10px 12px;font-size:17px;font-weight:600;line-height:1.4}
.say small{display:block;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.body p{margin:0 0 8px}
.body p:last-child{margin:0}
.body ul{margin:0 0 8px;padding-left:20px}
.body li{margin:2px 0}
.flag{background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn);border-radius:10px;padding:8px 12px;font-size:14px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:14.5px;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--sunk);font-weight:600;font-size:13px}
tr:last-child td{border-bottom:0}
td a{white-space:nowrap}
table.nw td{white-space:nowrap}
.acts{display:flex;flex-direction:column;gap:6px}
.act{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.act a{flex:1;min-width:0;display:flex;flex-direction:column;padding:8px 12px;text-decoration:none;color:var(--ink)}
.act a b{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.act a span{color:var(--link);font-weight:600;overflow-wrap:anywhere}
.act button{border:0;border-left:1px solid var(--line);background:var(--sunk);padding:0 14px;cursor:pointer;font-size:14px;font-weight:600}
.copyall{align-self:flex-start;border:1px solid var(--line);background:transparent;border-radius:10px;padding:7px 12px;cursor:pointer;font-size:14px;font-weight:600}
mark{background:var(--hl);color:inherit;border-radius:3px;padding:0 1px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:18px;color:var(--muted)}
.foot{font-size:13px;color:var(--muted);line-height:1.5}
.cat.pgm{background:var(--navy);color:var(--navy-ink);border-color:transparent;grid-column:1/-1;min-height:0;display:grid;grid-template-columns:auto 1fr;column-gap:12px;align-items:center}
.cat.pgm .ic{grid-row:1/4;margin:0;width:44px;height:44px}
.cat.pgm b{font-size:17px}
.cat.pgm span{color:inherit;opacity:.82}
.cat.pgm i{color:#FFC98F}
.filters{display:flex;gap:8px;overflow-x:auto;margin-inline:-16px;padding:2px 16px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fchip{flex:none;white-space:nowrap;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer}
.fchip[aria-pressed="true"]{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}
.stamp{font-size:13px;color:var(--muted);margin:-10px 0 0}
.stamp.old{color:var(--warn);font-weight:600}
.month{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 -12px}
.dt{flex:none;width:50px;text-align:center;border-radius:10px;background:var(--sunk);padding:7px 0 6px;line-height:1.1}
.dt b{display:block;font-size:19px;font-variant-numeric:tabular-nums}
.dt small{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.pmeta{display:block;font-weight:400;font-size:14px;color:var(--muted);margin-top:2px}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.pill{font-size:12px;font-weight:600;border-radius:999px;padding:1px 8px;background:var(--sunk);color:var(--ink)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.no{background:var(--warn-bg);color:var(--warn)}
.pill.ssb{background:var(--saffron-soft);color:var(--saffron)}
.subhead{font-family:var(--font-display);font-size:17px;margin:4px 0 -8px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:10px 16px;border-radius:10px;font-weight:600;font-size:15px;z-index:20}
@media (min-width:640px){.cats{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:380px){.cat span{display:none}.cat{min-height:0}}
.cs{display:none}
@media (max-width:520px){.cn{display:none}.cs{display:inline}}
@media (display-mode: standalone){.hint{display:none}}

/* ---- Log call ---- */
.logbtn{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:15;display:flex;align-items:center;gap:8px;border:0;border-radius:999px;background:var(--saffron-btn);color:#fff;font-weight:600;font-size:16px;padding:13px 20px;box-shadow:0 6px 18px rgba(0,0,0,.28);cursor:pointer}
.logbtn .q-n{background:#fff;color:var(--saffron-btn);border-radius:999px;font-size:12px;min-width:20px;padding:1px 6px;text-align:center}
dialog.logdlg{border:0;padding:0;margin:auto auto 0;width:100%;max-width:560px;max-height:92vh;border-radius:18px 18px 0 0;background:var(--surface);color:var(--ink)}
dialog.logdlg::backdrop{background:rgba(8,12,30,.55)}
.lg{display:flex;flex-direction:column;gap:12px;padding:16px 16px 0}
.lg-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.lg-head h2{font-family:var(--font-display);font-size:19px;margin:0}
.x{border:0;background:var(--sunk);border-radius:10px;width:38px;height:38px;font-size:18px;cursor:pointer}
.lbl{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 -6px}
.lbl small{text-transform:none;letter-spacing:0;font-weight:400}
.who{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--sunk);border-radius:12px;padding:10px 12px;font-size:15px}
.who button{border:0;background:transparent;color:var(--link);font-weight:600;font-size:14px;cursor:pointer}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lg input,.lg select{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--ground);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
.rchips{display:flex;flex-wrap:wrap;gap:6px}
.rchip{border:1px solid var(--line);background:var(--ground);border-radius:10px;padding:7px 11px;font-size:14.5px;cursor:pointer;text-align:left}
.rchip[aria-pressed="true"]{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}
.rchip .sg{display:block;font-size:11px;font-weight:600;color:var(--saffron);letter-spacing:.04em;text-transform:uppercase}
.rchip[aria-pressed="true"] .sg{color:#FFC98F}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{border:1px solid var(--line);background:var(--ground);border-radius:10px;padding:9px 4px;white-space:nowrap;font-size:14px;font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}
.lg .err{color:var(--warn);font-weight:600;font-size:14px;margin:0}
.sent{padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
.sent-p{margin:0;color:var(--muted);font-size:15px}
.wa-preview{margin:0;white-space:pre-wrap;font:inherit;font-size:14.5px;background:var(--sunk);border-radius:12px;padding:12px}
.wa{display:flex;align-items:center;justify-content:center;gap:8px;background:#1FA855;color:#fff;text-decoration:none;font-weight:600;font-size:17px;border-radius:12px;padding:14px}
.skip{border:0;background:transparent;color:var(--muted);font-size:15px;padding:8px;cursor:pointer}
.save{position:sticky;bottom:0;margin:0 -16px;border-radius:0;box-shadow:0 -6px 14px -8px rgba(0,0,0,.3);padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))!important;border:0;background:var(--saffron-btn);color:#fff;font-weight:600;font-size:17px;padding:14px;cursor:pointer}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="top">
  <div class="top-inner">
    <div class="brand">
      <img class="logo" src="logo.jpg" alt=""><div class="bt"><h1>SSB Call Desk</h1><p class="sub">Sadhguru Sannidhi Bengaluru</p></div>

</header>
<div class="searchbar">
  <label class="search" for="q">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Search: bus, refund, shoonya…" autocomplete="off" enterkeyhint="search" aria-label="Search the knowledge base">

  </label>
</div>
<main class="wrap" id="app"></main>
<div class="toast" id="toast" hidden></div>
<button type="button" class="logbtn" id="logbtn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Log call<span class="q-n" id="qn" hidden></span></button>
<dialog class="logdlg" id="logdlg" aria-labelledby="lg-title">
  <form class="lg" id="logform" novalidate>

  </div>
</dialog>

<script>
/* ============ KNOWLEDGE BASE ============
   Each entry: id, cat, q (question), say (short answer to read out),

const norm=s=>String(s).toLowerCase().replace(/<[^>]+>/g," ").normalize("NFKD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9₹]+/g," ").trim();

  it._w=[...new Set((it._q+" "+it._k+" "+it._b).split(" "))];

function lev(a,b){if(Math.abs(a.length-b.length)>1)return 2;const m=a.length,n=b.length;let p=Array.from({length:n+1},(_,i)=>i);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
function tokHits(tok,it){
  let s=0;
  if(it._q.includes(tok))s+=6; if(it._k.includes(tok))s+=4; if(it._b.includes(tok))s+=2;
  if(s)return s;
  if(tok.length>=4){for(const w of it._w){if(w.length>=tok.length-1&&lev(tok,w.slice(0,tok.length))<=1)return 1.5;}}
  return 0;
}
const STOP=new Set("the a an is are to of for at in on and or what how when where can i do we my there any".split(" "));
function search(q){
  let toks=norm(q).split(" ").filter(t=>t&&!STOP.has(t));
  if(!toks.length)toks=norm(q).split(" ").filter(Boolean);
  if(!toks.length)return {res:[],loose:false};
  const scored=KB.map(it=>{let sum=0,hit=0;for(const t of toks){const h=tokHits(t,it);if(h){hit++;sum+=h}}return{it,sum,hit}});
  let res=scored.filter(x=>x.hit===toks.length).sort((a,b)=>b.sum-a.sum);
  if(res.length)return{res:res.map(x=>x.it),loose:false};
  res=scored.filter(x=>x.hit>0).sort((a,b)=>b.hit-a.hit||b.sum-a.sum).slice(0,12);
  return{res:res.map(x=>x.it),loose:true,toks};
}

function hl(text,toks){
  let h=esc(text);toks=(toks||[]).filter(t=>t.length>1);if(!toks.length)return h;
  const re=new RegExp("("+toks.map(t=>t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|")+")","gi");
  return h.replace(re,"<mark>$1</mark>");
}
function fmtNum(v){const d=v.replace(/\D/g,"");if(/^91\d{10}$/.test(d))return"+91 "+d.slice(2,7)+" "+d.slice(7);if(/^0\d{10}$/.test(d))return d.slice(0,3)+"-"+d.slice(3,7)+" "+d.slice(7);if(/^\d{10}$/.test(d))return d.slice(0,5)+" "+d.slice(5);return v}
function actHref(a){
  if(a.t==="tel")return"tel:"+a.v.replace(/\s/g,"");
  if(a.t==="sms")return"sms:"+a.v;
  if(a.t==="mail")return"mailto:"+a.v;
  return a.v;
}
function actShow(a){return(a.t==="tel"||a.t==="sms")?fmtNum(a.v):a.t==="url"?a.v.replace(/^https?:\/\//,"").replace(/\/$/,""):a.v}
function renderBody(txt){
  const out=[];let list=null;
  for(const line of txt.split("\n")){
    if(line.startsWith("- ")){if(!list){list=[];}list.push("<li>"+esc(line.slice(2))+"</li>");continue}
    if(list){out.push("<ul>"+list.join("")+"</ul>");list=null}
    if(line.trim())out.push("<p>"+esc(line)+"</p>");
  }
  if(list)out.push("<ul>"+list.join("")+"</ul>");
  return out.join("");
}
function itemText(it){

  (it.acts||[]).forEach(a=>t+="\n"+a.l+": "+(a.t==="tel"||a.t==="sms"?fmtNum(a.v):a.v));
  return t;
}

const MONL=["January","February","March","April","May","June","July","August","September","October","November","December"];
const DAY=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const pd=s=>new Date(String(s).replace(" ","T"));
function pName(p){return p.name.replace(/\s*,?\s*Sadhguru Sannidhi Bengaluru.*$/i,"").trim()}
function pLang(l){return String(l||"").split(",").map(x=>({en:"English",kn:"Kannada",ta:"Tamil",hi:"Hindi",te:"Telugu"}[x.trim()]||x.trim().replace(/^./,c=>c.toUpperCase()))).join(", ")}
function pDate(p){const a=pd(p.start),b=pd(p.end||p.start);
  if(a.toDateString()===b.toDateString())return `${DAY[a.getDay()]} ${a.getDate()} ${MON[a.getMonth()]}`;
  if(a.getMonth()===b.getMonth())return `${a.getDate()}–${b.getDate()} ${MON[a.getMonth()]}`;
  return `${a.getDate()} ${MON[a.getMonth()]} – ${b.getDate()} ${MON[b.getMonth()]}`}
const t12=d=>{let h=d.getHours(),m=d.getMinutes();const ap=h>=12?"PM":"AM";h=h%12||12;return h+(m?":"+String(m).padStart(2,"0"):"")+" "+ap};
function pTime(p){if(p.time&&p.time!=="-")return p.time.replace(/(\d)(AM|PM)/g,"$1 $2").replace(" - "," – ");
  const a=pd(p.start),b=pd(p.end||p.start);return a.toDateString()===b.toDateString()?`${t12(a)} – ${t12(b)}`:`Starts ${t12(a)}, ends ${t12(b)} last day`}
function pWhere(p){return p.ssb?"Sadhguru Sannidhi, Chikkaballapur":[p.venue,p.area].filter(Boolean).join(", ")}
function pFee(p){return p.free?"Free":p.fee?"₹"+Number(p.fee).toLocaleString("en-IN"):""}
function pPage(p){return "https://isha.sadhguru.org/in/en/program-details?id="+p.id}
function pUpcoming(){const now=new Date();now.setHours(0,0,0,0);return (PDATA.programs||[]).filter(p=>pd(p.end||p.start)>=now)}
function pIndex(){pUpcoming().forEach(p=>{const a=pd(p.start),b=pd(p.end||p.start);
  p._t=norm([pName(p),p.venue,p.area,pLang(p.lang),p.ssb?"sadhguru sannidhi ssb chikkaballapur":"",MONL[a.getMonth()],MON[a.getMonth()],MONL[b.getMonth()],p.closed?"closed":"open",p.gender==="ladies"?"ladies women":"","program programme upcoming"].join(" "))})}
function pText(p){return `${pName(p)}\n${pDate(p)} · ${pTime(p)}\n${pWhere(p)}\n${[pFee(p),pLang(p.lang)].filter(Boolean).join(" · ")}${p.gender==="ladies"?" · Ladies only":""}\n${p.closed?"Registration closed":"Register: "+(p.url||pPage(p))}`}
function pStamp(){if(!PDATA.updated)return"";const u=new Date(PDATA.updated),hrs=(Date.now()-u)/36e5;
  const txt=`Updated ${u.getDate()} ${MON[u.getMonth()]}, ${t12(u)} from isha.sadhguru.org`;
  return hrs>36?`<p class="stamp old">${txt} — may be out of date. Confirm on the <a href="https://isha.sadhguru.org/in/en/program-finder?city=Bengaluru&state=Karnataka" target="_blank" rel="noopener">program finder</a>.</p>`:`<p class="stamp">${txt}</p>`}

 contacts:'<path d="M20 15.5v3a2 2 0 0 1-2.2 2A17 17 0 0 1 3.5 6.2 2 2 0 0 1 5.5 4h3a2 2 0 0 1 2 1.6l.5 2.6a2 2 0 0 1-.6 1.8l-1.3 1.3a13 13 0 0 0 5.6 5.6l1.3-1.3a2 2 0 0 1 1.8-.6l2.6.5a2 2 0 0 1 1.6 2z"/>',
 iyc:'<path d="M2.5 20 9 9l4 6.5L16 11l5.5 9z"/><circle cx="17.5" cy="5" r="1.8"/>',
 agent:'<path d="M4 5h16v11H9l-5 4z"/><path d="M8 9.5h8M8 12.5h5"/>'
};
const icon=id=>`<span class="ic" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${ICON[id]||""}</svg></span>`;
function renderHome(){
  const recent=store.get("ssb-recent",[]).map(id=>KB.find(k=>k.id===id)).filter(Boolean);
  const up=pUpcoming(),openN=up.filter(p=>!p.closed).length,nextSSB=up.find(p=>p.ssb&&!p.closed);
  const g=GLANCE.slice();if(nextSSB)g.splice(5,0,["Next at SSB",pName(nextSSB).replace(/\s*\(English\)/,"")+", "+pDate(nextSSB)]);
  const tile=c=>c.pgm?`<button type="button" class="cat pgm" data-cat="pgm">${icon("pgm")}<b>Upcoming programs</b><span>Karnataka & Sadhguru Sannidhi — dates, venues, fees, registration links</span><i>${up.length} programs · ${openN} open${PDATA.updated?" · updated "+new Date(PDATA.updated).getDate()+" "+MON[new Date(PDATA.updated).getMonth()]:""}</i></button>`
    :`<button type="button" class="cat${c.agent?" agent":""}" data-cat="${c.id}">${icon(c.id)}<b>${esc(c.name)}</b><span>${esc(c.hint)}</span><i>${KB.filter(k=>k.cat===c.id).length} answers</i></button>`;
  app.innerHTML=`
  <section><p class="label">At a glance</p><div class="glance">${g.map(([k,v])=>`<div class="gr"><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join("")}</div></section>
  <section><p class="label">Topics</p><div class="cats">${CATS.map(tile).join("")}</div></section>
  ${recent.length?`<section><p class="label">Recently opened</p><div class="recent">${recent.map(r=>`<button type="button" class="chip" data-goto="${r.id}">${esc(r.q)}</button>`).join("")}</div></section>`:""}
  <p class="foot hint">Tip: on Android Chrome, tap ⋮ → “Add to Home screen” to keep this one tap away. Items marked <b>Check</b> need confirming with the team.</p>`;
}
function renderCat(id,openId){
  if(id==="pgm"){renderPrograms();return}
  const c=CATS.find(x=>x.id===id);if(!c){renderHome();return}
  const items=KB.filter(k=>k.cat===id);
  app.innerHTML=`<div class="head"><button type="button" class="back" data-home>← Topics</button><h2>${esc(c.name)}</h2></div>
  <div class="list">${items.map(it=>itemHTML(it,{open:it.id===openId})).join("")}</div>`;
  if(openId){const el=document.getElementById("it-"+openId);if(el)el.scrollIntoView({block:"start"});}
}
function renderSearch(q){
  const {res,loose,toks}=search(q);
  const t=toks||norm(q).split(" ").filter(x=>x&&!STOP.has(x));
  const pr=pSearch(t).slice(0,25);if(pr.length&&loose)res.length=0;const total=res.length+pr.length;
  const progBlock=pr.length?`<p class="subhead">Upcoming programs (${pr.length})</p><div class="list">${pr.map(p=>progHTML(p,t,false)).join("")}</div>`:"";
  const ansBlock=res.length?`${pr.length?`<p class="subhead">Answers</p>`:""}${loose?`<p class="meta" style="margin:0">No answer matched every word — closest matches:</p>`:""}<div class="list">${res.map((it,i)=>itemHTML(it,{showCat:true,toks:t,open:total===1})).join("")}</div>`:"";
  const programFirst=pr.length&&(loose||!res.length||/program|ie|inner|yoga|shoonya|bhava|samyama|kriya|asana|angamardana|janani|pooja/.test(t.join(" ")));
  app.innerHTML=`<div class="head"><button type="button" class="back" data-home>← Topics</button><h2>${total?`${total} result${total>1?"s":""}`:"No results"}</h2></div>
  ${total?(programFirst?progBlock+ansBlock:ansBlock+progBlock):
  `<div class="empty">Nothing found for “${esc(q)}”. Try one simple word — e.g. <b>bus</b>, <b>refund</b>, <b>seva</b>, <b>shop</b> — or check the <a href="https://tinyurl.com/SSBFAQ" target="_blank" rel="noopener">FAQ doc</a>.</div>`}`;
}

function route(){
  const q=input.value.trim();clearBtn.hidden=!q;
  if(q){renderSearch(q);return}
  const m=location.hash.match(/^#c\/(\w+)(?:\/(\w+))?/);
  if(m)renderCat(m[1],m[2]);else renderHome();
}
function remember(id){let r=store.get("ssb-recent",[]).filter(x=>x!==id);r.unshift(id);store.set("ssb-recent",r.slice(0,6))}
let toastT;function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,1600)}
async function copy(text,msg){
  try{await navigator.clipboard.writeText(text);toast(msg)}catch(e){
    const ta=document.createElement("textarea");ta.value=text;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();
    try{document.execCommand("copy");toast(msg)}catch(_){toast("Copy not allowed here — press and hold to copy")}ta.remove();
  }
}

app.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.cat){const c=CATS.find(x=>x.id===b.dataset.cat);noteTopic(b.dataset.cat,"",c&&c.name);location.hash="#c/"+b.dataset.cat;window.scrollTo(0,0);return}
  if(b.hasAttribute("data-home")){input.value="";if(location.hash)location.hash="";else route();window.scrollTo(0,0);return}
  if(b.dataset.goto){const it=KB.find(k=>k.id===b.dataset.goto);remember(it.id);location.hash="#c/"+it.cat+"/"+it.id;return}
  if(b.dataset.toggle){
    const item=b.parentElement,open=!item.classList.contains("open");
    item.classList.toggle("open",open);b.setAttribute("aria-expanded",open);
    const tpl=item.querySelector("template");if(tpl&&open){item.insertAdjacentHTML("beforeend",tpl.innerHTML);tpl.remove()}
    if(open){const it=KB.find(k=>k.id===b.dataset.toggle);if(it){remember(it.id);noteTopic(it.cat,it.id,it.q)}else if(b.dataset.toggle[0]==="p"){const p=pUpcoming().find(x=>"p"+x.id===b.dataset.toggle);noteTopic("pgm","",p?pName(p)+" "+pDate(p):"Program")}}return;
  }
  if(b.dataset.pf){const[k,v]=b.dataset.pf.split(":");if(k==="open")pf.open=!pf.open;else pf.area=v;renderPrograms();return}
  if(b.dataset.pcopy){const p=pUpcoming().find(x=>x.id===b.dataset.pcopy);if(p)copy(pText(p),"Program details copied");return}
  if(b.dataset.plink){const[id,i]=b.dataset.plink.split(":");const p=pUpcoming().find(x=>x.id===id);if(!p)return;const l=(p.url&&!p.closed)?[p.url,pPage(p)]:[pPage(p)];copy(l[+i],"Link copied");return}
  if(b.dataset.copy){const[id,i]=b.dataset.copy.split(":");const a=KB.find(k=>k.id===id).acts[+i];copy(a.v,"Copied "+a.l);return}
  if(b.dataset.copyall){const it=KB.find(k=>k.id===b.dataset.copyall);copy(it.copy||itemText(it),it.copy?"SMS text copied":"Answer copied");return}
});
let deb;input.addEventListener("input",()=>{clearTimeout(deb);deb=setTimeout(()=>{route();window.scrollTo(0,0)},120)});
clearBtn.addEventListener("click",()=>{input.value="";route();input.focus()});
window.addEventListener("hashchange",route);
route();
loadPrograms();
/* ============ LOG CALL (sends to the Google Sheet) ============ */
const LOG_URL="https://script.google.com/macros/s/AKfycbzmu0H1y6451cZc7zqA3JlrUdHWlMa-3I-DIy8nXBVG2u9kVuwdiGOGDCwnFWTjwHih/exec";
const REASONS=["Visit & timings","Directions / travel","Rituals & offerings","Program dates & registration","Program info (SSB)","Inner Engineering / online","Refund / cancellation","Volunteering","Isha Life shop","Donation","Centre contact","Isha Yoga Center (IYC)","Complaint / feedback","Other"];
const LINES=["SSB – General","SSBP – Programs","SSBWE – Weekend","JN – Programs","JN – Isha Shoppe","Outside Bangalore","Other"];
const OUTCOMES=["Answered","Needs follow-up","Transferred"];
const CAT2REASON={visit:"Visit & timings",travel:"Directions / travel",rituals:"Rituals & offerings",pgm:"Program dates & registration",programs:"Program info (SSB)",ie:"Inner Engineering / online",vol:"Volunteering",shop:"Isha Life shop",contacts:"Centre contact",iyc:"Isha Yoga Center (IYC)"};
const ID2REASON={refund:"Refund / cancellation",rereg:"Refund / cancellation",donate:"Donation",mahakshetra:"Donation",pgmreg:"Program dates & registration"};
let lastTopic=null; // {reason, label, at}
function noteTopic(cat,id,label){const r=ID2REASON[id]||CAT2REASON[cat];if(r)lastTopic={reason:r,label:label||"",at:Date.now()}}
const lg={reason:"",outcome:"Answered",editWho:false};
function me(){return store.get("ssb-agent",{name:"",line:""})}
function qGet(){return store.get("ssb-logq",[])}
function qSet(q){store.set("ssb-logq",q);qBadge()}
function qBadge(){const n=qGet().length,el=$("#qn");el.hidden=!n;el.textContent=n}
function renderWho(){const a=me(),box=$("#lg-who");
  if(a.name&&a.line&&!lg.editWho){box.innerHTML=`<div class="who"><span><b>${esc(a.name)}</b> · ${esc(a.line)}</span><button type="button" data-editwho>Change</button></div>`;return}
  box.innerHTML=`<div class="row2"><input id="lg-name" type="text" autocomplete="name" placeholder="Your name" value="${esc(a.name)}" aria-label="Your name"><select id="lg-line" aria-label="Your line"><option value="">Your line…</option>${LINES.map(l=>`<option${l===a.line?" selected":""}>${esc(l)}</option>`).join("")}</select></div>`}
function renderReasons(){const sug=lastTopic&&Date.now()-lastTopic.at<20*60e3?lastTopic.reason:"";
  $("#lg-reasons").innerHTML=REASONS.map(r=>`<button type="button" class="rchip" data-reason="${esc(r)}" aria-pressed="${r===lg.reason}">${r===sug?'<span class="sg">Suggested</span>':""}${esc(r)}</button>`).join("");
  $("#lg-outcome").innerHTML=OUTCOMES.map(o=>`<button type="button" data-outcome="${o}" aria-pressed="${o===lg.outcome}">${o==="Needs follow-up"?"Follow-up":o}</button>`).join("")}
function waText(en){const t=new Date(en.time),head=en.outcome==="Transferred"?"↪️ *Call transferred*":"🔁 *Follow-up needed*";
  return [head,"Reason: "+en.reason,en.caller?"Caller: "+en.caller:"Caller: (number not noted)",en.note?"Note: "+en.note:"",en.topic?"Asked about: "+en.topic:"","Line: "+en.line+" · Agent: "+en.agent,`${t.getDate()} ${MON[t.getMonth()]}, ${t12(t)}`].filter(Boolean).join("\n")}
function showSent(en){const txt=waText(en);$("#wa-preview").textContent=txt;$("#wa-send").href="https://wa.me/?text="+encodeURIComponent(txt);$("#logform").hidden=true;$("#lg-sent").hidden=false}
function openLog(){$("#logform").hidden=false;$("#lg-sent").hidden=true;const sug=lastTopic&&Date.now()-lastTopic.at<20*60e3?lastTopic.reason:"";
  lg.reason=sug;lg.outcome="Answered";lg.editWho=false;$("#lg-caller").value="";$("#lg-note").value="";$("#lg-err").hidden=true;
  renderWho();renderReasons();const d=$("#logdlg");if(d.showModal)d.showModal();else d.setAttribute("open","")}
function closeLog(){const d=$("#logdlg");if(d.close)d.close();else d.removeAttribute("open")}
let sending=false;
async function flushLog(){if(!LOG_URL||sending)return;const q=qGet();if(!q.length)return;sending=true;
  try{await fetch(LOG_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({items:q})});
    const sent=new Set(q.map(x=>x.id));qSet(qGet().filter(x=>!sent.has(x.id)))}catch(e){}
  sending=false}
$("#logbtn").addEventListener("click",openLog);
$("#wa-send").addEventListener("click",()=>setTimeout(closeLog,400));
$("#logdlg").addEventListener("click",e=>{
  const b=e.target.closest("button");if(e.target.id==="logdlg"){closeLog();return}if(!b)return;
  if(b.hasAttribute("data-close")){closeLog();return}
  if(b.hasAttribute("data-editwho")){lg.editWho=true;renderWho();return}
  if(b.dataset.reason){lg.reason=b.dataset.reason;renderReasons();return}
  if(b.dataset.outcome){lg.outcome=b.dataset.outcome;renderReasons();return}});
$("#logform").addEventListener("submit",e=>{e.preventDefault();
  const err=$("#lg-err"),a=me();
  if($("#lg-name")){a.name=$("#lg-name").value.trim();a.line=$("#lg-line").value}
  const miss=!a.name?"your name":!a.line?"your line":!lg.reason?"a reason":"";
  if(miss){err.textContent="Please choose "+miss+".";err.hidden=false;return}
  store.set("ssb-agent",a);
  const entry={id:Date.now().toString(36)+Math.random().toString(36).slice(2,7),time:new Date().toISOString(),agent:a.name,line:a.line,reason:lg.reason,outcome:lg.outcome,caller:$("#lg-caller").value.trim(),note:$("#lg-note").value.trim(),topic:lastTopic&&Date.now()-lastTopic.at<20*60e3?lastTopic.label:""};
  qSet(qGet().concat(entry));lastTopic=null;
  if(entry.outcome!=="Answered")showSent(entry);else closeLog();
  if(LOG_URL&&navigator.onLine){toast("Call logged");flushLog()}else toast(LOG_URL?"Saved on phone — will send when online":"Saved on this phone (sheet not connected yet)")});
window.addEventListener("online",flushLog);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)flushLog()});
qBadge();flushLog();

if("serviceWorker" in navigator&&location.protocol==="https:"){navigator.serviceWorker.register("sw.js").catch(()=>{})}
</script>
