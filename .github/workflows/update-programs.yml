name: Update upcoming programs

on:
  schedule:
    - cron: "30 23 * * *"   # 5:00 AM IST every day
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pull programs from Isha's program feed
        run: node scripts/update-programs.mjs
      - name: Save if anything changed
        run: |
          git config user.name "ssb-desk-bot"
          git config user.email "ssb-desk-bot@users.noreply.github.com"
          git add programs.json
          git diff --staged --quiet || git commit -m "Daily program update"
          git push
